<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none" stroke="currentColor">
  <text x="300" y="34" font-size="18" font-weight="bold" text-anchor="middle" stroke="none" fill="currentColor"><tspan class="d-fill-1">#nav</tspan> <tspan class="d-fill-0">.item</tspan> <tspan class="d-fill-2">a</tspan><tspan class="d-fill-0">:hover</tspan></text>

  <rect class="d-fill-1 d-tint d-stroke-1" x="20" y="56" width="176" height="136" rx="6"/>
  <rect class="d-fill-0 d-tint d-stroke-0" x="212" y="56" width="176" height="136" rx="6"/>
  <rect class="d-fill-2 d-tint d-stroke-2" x="404" y="56" width="176" height="136" rx="6"/>

  <g fill="currentColor" stroke="none" text-anchor="middle">
    <g font-size="14" font-weight="bold">
      <text x="108" y="82">A · IDs</text>
      <text x="300" y="82">B · classes</text>
      <text x="492" y="82">C · types</text>
    </g>
    <g class="d-muted" font-size="11">
      <text x="108" y="102">#id</text>
      <text x="300" y="102">.class  [attr]  :hover</text>
      <text x="492" y="102">div  ::before</text>
    </g>
    <g font-size="34" font-weight="bold">
      <text class="d-fill-1" x="108" y="148">1</text>
      <text class="d-fill-0" x="300" y="148">2</text>
      <text class="d-fill-2" x="492" y="148">1</text>
    </g>
    <text class="d-fill-1" x="108" y="176">#nav</text>
    <text class="d-fill-0" x="300" y="176">.item  :hover</text>
    <text class="d-fill-2" x="492" y="176">a</text>

    <text x="300" y="218" font-size="14" font-weight="bold">specificity 1-2-1</text>
    <text class="d-muted" x="300" y="238" font-size="11">*, combinators and :where() add 0; :is() and :not() add their argument</text>
  </g>

  <path class="d-muted" d="M20 256 H580" stroke-dasharray="4 4"/>

  <rect class="d-fill-1 d-tint" x="340" y="292" width="40" height="76" rx="4" stroke="none"/>
  <g fill="currentColor" stroke="none">
    <text x="20" y="282" font-weight="bold">Compare column by column, from the left</text>
    <g class="d-muted" font-size="11" text-anchor="middle">
      <text x="360" y="306">A</text>
      <text x="420" y="306">B</text>
      <text x="480" y="306">C</text>
    </g>
    <text class="d-fill-1" x="20" y="332">#main</text>
    <text class="d-fill-0" x="20" y="358">.a.b.c.d.e.f.g.h.i.j.k</text>
    <g text-anchor="middle">
      <text x="360" y="332" font-weight="bold">1</text>
      <text x="420" y="332">0</text>
      <text x="480" y="332">0</text>
      <text x="360" y="358">0</text>
      <text x="420" y="358">11</text>
      <text x="480" y="358">0</text>
    </g>
    <text class="d-fill-2" x="520" y="332" font-weight="bold">wins</text>
    <text class="d-muted" x="300" y="390" font-size="11" text-anchor="middle">A differs (1 vs 0), so B and C are never compared: 11 classes don't carry over</text>
  </g>
</svg>
