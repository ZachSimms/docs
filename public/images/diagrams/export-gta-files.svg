<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 366" fill="none" stroke="currentColor">
  <defs>
    <marker id="export-gta-files-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>
  <g stroke="none">
    <rect class="d-fill-1 d-tint" x="16" y="16" width="170" height="48" rx="4"/>
    <rect class="d-fill-1 d-tint" x="215" y="16" width="170" height="48" rx="4"/>
    <rect class="d-fill-1 d-tint" x="414" y="16" width="170" height="48" rx="4"/>
    <rect class="d-fill-2 d-tint" x="140" y="126" width="320" height="48" rx="4"/>
    <rect class="d-fill-3 d-tint" x="140" y="236" width="320" height="48" rx="4"/>
  </g>
  <g class="d-stroke-1">
    <rect x="16" y="16" width="170" height="48" rx="4"/>
    <rect x="215" y="16" width="170" height="48" rx="4"/>
    <rect x="414" y="16" width="170" height="48" rx="4"/>
  </g>
  <rect class="d-stroke-2" x="140" y="126" width="320" height="48" rx="4"/>
  <rect class="d-stroke-3" x="140" y="236" width="320" height="48" rx="4"/>
  <g>
    <path d="M230 126 L120 68" marker-end="url(#export-gta-files-arrow)"/>
    <path d="M300 126 V 68" marker-end="url(#export-gta-files-arrow)"/>
    <path d="M300 236 V 178" marker-end="url(#export-gta-files-arrow)"/>
  </g>
  <g fill="currentColor" stroke="none" font-size="13">
    <text x="101" y="37" text-anchor="middle">.ytd</text>
    <text x="300" y="37" text-anchor="middle">.ydr</text>
    <text x="499" y="37" text-anchor="middle">.ybn</text>
    <text x="300" y="147" text-anchor="middle">.ytyp  archetype "my_crate"</text>
    <text x="300" y="257" text-anchor="middle">.ymap  entity "my_crate"</text>
    <g class="d-muted" font-size="12">
      <text x="101" y="54" text-anchor="middle">texture dictionary</text>
      <text x="300" y="54" text-anchor="middle">model + shaders</text>
      <text x="499" y="54" text-anchor="middle">static collision</text>
      <text x="300" y="164" text-anchor="middle">drawable name, txd name, LOD distance</text>
      <text x="300" y="274" text-anchor="middle">position, rotation, archetype name</text>
      <text x="150" y="98" text-anchor="end">txd name</text>
      <text x="308" y="102">drawable name</text>
      <text x="308" y="212">archetypeName</text>
      <text x="499" y="86" text-anchor="middle">own world-space bounds;</text>
      <text x="499" y="101" text-anchor="middle">or embed in the .ydr</text>
    </g>
    <text x="16" y="316">Arrows point at what a file names. _manifest.ymf tells</text>
    <text x="16" y="334">the game which .ytyp each .ymap needs. Everything goes in</text>
    <text x="16" y="352">stream/ (FiveM) or a mod RPF (single-player).</text>
  </g>
</svg>
