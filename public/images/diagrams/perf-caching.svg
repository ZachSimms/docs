<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" fill="none" stroke="currentColor">
  <defs>
    <marker id="perf-caching-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>
  <rect x="16" y="24" width="150" height="44" rx="4"/>
  <rect x="226" y="24" width="150" height="44" rx="4"/>
  <rect x="436" y="24" width="148" height="44" rx="4"/>
  <path d="M166 38 H 222" marker-end="url(#perf-caching-arrow)"/>
  <path d="M376 38 H 432" marker-end="url(#perf-caching-arrow)"/>
  <path class="d-muted" d="M222 56 H 170" marker-end="url(#perf-caching-arrow)"/>
  <path class="d-muted" d="M432 56 H 380" marker-end="url(#perf-caching-arrow)"/>
  <g stroke="none">
    <rect class="d-fill-2 d-tint" x="16" y="160" width="284" height="20"/>
    <rect class="d-chip" x="300" y="160" width="150" height="20"/>
    <rect class="d-fill-1 d-tint" x="450" y="160" width="134" height="20"/>
  </g>
  <rect x="16" y="160" width="568" height="20"/>
  <g fill="currentColor" stroke="none">
    <text x="91" y="51" text-anchor="middle">browser cache</text>
    <text x="301" y="51" text-anchor="middle">CDN edge</text>
    <text x="510" y="51" text-anchor="middle">origin</text>
    <g font-size="11">
      <text x="16" y="88">fresh: used, no request</text>
      <text x="16" y="104">stale: If-None-Match</text>
      <text x="226" y="88">fresh: answers at the edge</text>
      <text x="226" y="104">stale: asks the origin</text>
      <text x="436" y="88">304: unchanged, no body</text>
      <text x="436" y="104">or 200 with the new body</text>
    </g>
    <g font-size="11" text-anchor="middle">
      <text x="158" y="152">fresh (max-age / s-maxage)</text>
      <text x="375" y="152">stale-while-revalidate</text>
      <text x="517" y="152">revalidate first</text>
    </g>
    <text x="16" y="200" font-size="11" class="d-muted">age of the cached copy →</text>
  </g>
</svg>
