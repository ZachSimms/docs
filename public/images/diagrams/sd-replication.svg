<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none" stroke="currentColor">
  <defs>
    <marker id="sd-replication-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>
  <rect class="d-muted" x="8" y="8" width="188" height="300" rx="6" stroke-width="1"/>
  <rect class="d-muted" x="206" y="8" width="188" height="300" rx="6" stroke-width="1"/>
  <rect class="d-muted" x="404" y="8" width="188" height="300" rx="6" stroke-width="1"/>
  <rect class="d-bg" x="67" y="70" width="70" height="30" rx="5" stroke-width="1.5"/>
  <rect class="d-fill-0 d-tint d-stroke-0" x="62" y="140" width="80" height="34" rx="5" stroke-width="1.5"/>
  <path stroke-width="1.5" d="M102 101 V 138" marker-end="url(#sd-replication-arrow)"/>
  <rect class="d-chip" x="22" y="220" width="70" height="30" rx="5" stroke-width="1.5"/>
  <rect class="d-chip" x="112" y="220" width="70" height="30" rx="5" stroke-width="1.5"/>
  <path stroke-width="1.5" stroke-dasharray="5 3" d="M88 175 L 60 218" marker-end="url(#sd-replication-arrow)"/>
  <path stroke-width="1.5" stroke-dasharray="5 3" d="M116 175 L 144 218" marker-end="url(#sd-replication-arrow)"/>
  <rect class="d-bg" x="216" y="70" width="70" height="30" rx="5" stroke-width="1.5"/>
  <rect class="d-bg" x="314" y="70" width="70" height="30" rx="5" stroke-width="1.5"/>
  <rect class="d-fill-0 d-tint d-stroke-0" x="214" y="140" width="74" height="34" rx="5" stroke-width="1.5"/>
  <rect class="d-fill-1 d-tint d-stroke-1" x="312" y="140" width="74" height="34" rx="5" stroke-width="1.5"/>
  <path stroke-width="1.5" d="M251 101 V 138" marker-end="url(#sd-replication-arrow)"/>
  <path stroke-width="1.5" d="M349 101 V 138" marker-end="url(#sd-replication-arrow)"/>
  <path stroke-width="1.5" stroke-dasharray="5 3" d="M290 157 H 310" marker-start="url(#sd-replication-arrow)" marker-end="url(#sd-replication-arrow)"/>
  <rect class="d-chip" x="216" y="220" width="70" height="30" rx="5" stroke-width="1.5"/>
  <rect class="d-chip" x="314" y="220" width="70" height="30" rx="5" stroke-width="1.5"/>
  <path stroke-width="1.5" stroke-dasharray="5 3" d="M251 175 V 218" marker-end="url(#sd-replication-arrow)"/>
  <path stroke-width="1.5" stroke-dasharray="5 3" d="M349 175 V 218" marker-end="url(#sd-replication-arrow)"/>
  <rect class="d-bg" x="463" y="70" width="70" height="30" rx="5" stroke-width="1.5"/>
  <rect class="d-fill-2 d-tint d-stroke-2" x="416" y="170" width="50" height="34" rx="5" stroke-width="1.5"/>
  <path stroke-width="1.5" d="M484 101 L 441 168" marker-end="url(#sd-replication-arrow)"/>
  <rect class="d-fill-2 d-tint d-stroke-2" x="474" y="170" width="50" height="34" rx="5" stroke-width="1.5"/>
  <path stroke-width="1.5" d="M498 101 L 499 168" marker-end="url(#sd-replication-arrow)"/>
  <rect class="d-chip" x="532" y="170" width="50" height="34" rx="5" stroke-width="1.5"/>
  <path class="d-muted" stroke-width="1.5" d="M512 101 L 557 168" marker-end="url(#sd-replication-arrow)"/>
  <g fill="currentColor" stroke="none">
    <text x="102" y="30" font-size="13" text-anchor="middle" font-weight="600">Leader-follower</text>
    <text x="102" y="47" font-size="11" text-anchor="middle" class="d-muted">one writer</text>
    <text x="300" y="30" font-size="13" text-anchor="middle" font-weight="600">Multi-leader</text>
    <text x="300" y="47" font-size="11" text-anchor="middle" class="d-muted">a writer per region</text>
    <text x="498" y="30" font-size="13" text-anchor="middle" font-weight="600">Leaderless</text>
    <text x="498" y="47" font-size="11" text-anchor="middle" class="d-muted">quorum N=3, W=2, R=2</text>
    <text x="102" y="90" font-size="12" text-anchor="middle">client</text>
    <text x="102" y="162" font-size="12" text-anchor="middle" class="d-fill-0" font-weight="600">leader</text>
    <text x="108" y="125" font-size="11" text-anchor="start">writes</text>
    <text x="57" y="240" font-size="12" text-anchor="middle">follower</text>
    <text x="147" y="240" font-size="12" text-anchor="middle">follower</text>
    <text x="102" y="272" font-size="11" text-anchor="middle">reads: any replica</text>
    <text x="102" y="288" font-size="11" text-anchor="middle" class="d-muted">async lag = stale reads</text>
    <text x="102" y="204" font-size="11" text-anchor="middle" class="d-muted">log</text>
    <text x="251" y="90" font-size="12" text-anchor="middle">client EU</text>
    <text x="349" y="90" font-size="12" text-anchor="middle">client US</text>
    <text x="251" y="162" font-size="12" text-anchor="middle" class="d-fill-0" font-weight="600">leader EU</text>
    <text x="349" y="162" font-size="12" text-anchor="middle" class="d-fill-1" font-weight="600">leader US</text>
    <text x="251" y="240" font-size="12" text-anchor="middle">follower</text>
    <text x="349" y="240" font-size="12" text-anchor="middle">follower</text>
    <text x="300" y="122" font-size="11" text-anchor="middle" class="d-muted">replicate</text>
    <text x="300" y="136" font-size="11" text-anchor="middle" class="d-muted">both ways</text>
    <text x="300" y="272" font-size="11" text-anchor="middle">concurrent writes conflict:</text>
    <text x="300" y="288" font-size="11" text-anchor="middle" class="d-muted">LWW, merge or CRDT</text>
    <text x="498" y="90" font-size="12" text-anchor="middle">client</text>
    <text x="441" y="192" font-size="12" text-anchor="middle" font-weight="600">r1</text>
    <text x="441" y="222" font-size="11" text-anchor="middle" class="d-fill-2">ack</text>
    <text x="499" y="192" font-size="12" text-anchor="middle" font-weight="600">r2</text>
    <text x="499" y="222" font-size="11" text-anchor="middle" class="d-fill-2">ack</text>
    <text x="557" y="192" font-size="12" text-anchor="middle" font-weight="600">r3</text>
    <text x="557" y="222" font-size="11" text-anchor="middle" class="d-muted">late</text>
    <text x="498" y="256" font-size="11" text-anchor="middle">write all 3, done after W=2 acks</text>
    <text x="498" y="272" font-size="11" text-anchor="middle">read R=2 replicas, newest wins</text>
    <text x="498" y="288" font-size="11" text-anchor="middle" class="d-muted">R + W &gt; N → sets overlap</text>
    <text x="200" y="332" font-size="11" text-anchor="middle" class="d-muted">solid: client writes</text>
    <text x="400" y="332" font-size="11" text-anchor="middle" class="d-muted">dashed: replication (usually async)</text>
    <text x="300" y="350" font-size="11" text-anchor="middle" class="d-muted">Leader-follower is the default; multi-leader for multi-region writes; leaderless for write availability.</text>
  </g>
</svg>
