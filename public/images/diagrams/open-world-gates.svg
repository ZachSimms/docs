<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" fill="none" stroke="currentColor">
  <defs>
    <marker id="open-world-gates-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>
  <path stroke-width="2" d="M40 80 H 560" marker-start="url(#open-world-gates-arrow)" marker-end="url(#open-world-gates-arrow)"/>
  <circle class="d-fill-0" stroke="none" cx="100" cy="80" r="9"/>
  <circle class="d-fill-1" stroke="none" cx="233" cy="80" r="9"/>
  <circle class="d-fill-2" stroke="none" cx="366" cy="80" r="9"/>
  <circle class="d-fill-3" stroke="none" cx="500" cy="80" r="9"/>
  <g class="d-muted" stroke-width="1" stroke-dasharray="3 4">
    <path d="M100 95 V 118"/>
    <path d="M233 95 V 118"/>
    <path d="M366 95 V 118"/>
    <path d="M500 95 V 118"/>
  </g>
  <g fill="currentColor" stroke="none" font-size="12">
    <text x="40" y="36" font-weight="bold">soft</text>
    <text x="40" y="52" font-size="11" class="d-muted">the player decides when</text>
    <text x="560" y="36" text-anchor="end" font-weight="bold">hard</text>
    <text x="560" y="52" text-anchor="end" font-size="11" class="d-muted">the designer decides when</text>
  </g>
  <g fill="currentColor" stroke="none" font-size="12" font-weight="bold" text-anchor="middle">
    <text x="100" y="138" class="d-fill-0">Difficulty</text>
    <text x="233" y="138" class="d-fill-1">Knowledge</text>
    <text x="366" y="138" class="d-fill-2">Ability</text>
    <text x="500" y="138" class="d-fill-3">Story</text>
  </g>
  <g fill="currentColor" stroke="none" font-size="11" text-anchor="middle">
    <text x="100" y="162">strong enemies,</text>
    <text x="100" y="178">cold, heat, storms</text>
    <text x="100" y="194">skill or gear gets</text>
    <text x="100" y="210">you through early</text>
    <text x="233" y="162">a fact you learn:</text>
    <text x="233" y="178">a route, a timing,</text>
    <text x="233" y="194">a password</text>
    <text x="233" y="210">no item to find</text>
    <text x="366" y="162">a tool or a move:</text>
    <text x="366" y="178">glider, grapple,</text>
    <text x="366" y="194">swimming, a key</text>
    <text x="366" y="210">show the gate first</text>
    <text x="500" y="162">locked until a</text>
    <text x="500" y="178">plot beat happens</text>
    <text x="500" y="194">keeps order, costs</text>
    <text x="500" y="210">freedom: use few</text>
  </g>
  <g class="d-muted" fill="currentColor" stroke="none" font-size="11" text-anchor="middle">
    <text x="100" y="244">Elden Ring areas</text>
    <text x="233" y="244">Outer Wilds</text>
    <text x="366" y="244">metroidvanias</text>
    <text x="500" y="244">most story games</text>
    <text x="300" y="282">Most open worlds mix all four; the further right, the more the order of play is fixed.</text>
  </g>
</svg>
