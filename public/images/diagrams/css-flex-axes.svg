<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 310" fill="none" stroke="currentColor">
  <defs>
    <marker id="css-flex-axes-main" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="d-fill-0" stroke="none"/>
    </marker>
    <marker id="css-flex-axes-cross" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="d-fill-1" stroke="none"/>
    </marker>
  </defs>
  <rect x="150" y="60" width="420" height="160" rx="4"/>
  <rect class="d-fill-0 d-tint" x="170" y="80" width="80" height="120" rx="3"/>
  <rect class="d-fill-0 d-tint" x="266" y="80" width="80" height="120" rx="3"/>
  <rect class="d-fill-0 d-tint" x="362" y="80" width="80" height="120" rx="3"/>
  <rect class="d-muted" x="458" y="80" width="92" height="120" rx="3" stroke-dasharray="4 4"/>
  <path class="d-stroke-0" stroke-width="2" d="M150 244 H 568" marker-end="url(#css-flex-axes-main)"/>
  <path class="d-stroke-1" stroke-width="2" d="M118 60 V 218" marker-end="url(#css-flex-axes-cross)"/>
  <g fill="currentColor" stroke="none">
    <text x="150" y="40">display: flex; flex-direction: row</text>
    <text x="210" y="145" text-anchor="middle">1</text>
    <text x="306" y="145" text-anchor="middle">2</text>
    <text x="402" y="145" text-anchor="middle">3</text>
    <text x="504" y="136" text-anchor="middle" font-size="11" class="d-muted">free</text>
    <text x="504" y="152" text-anchor="middle" font-size="11" class="d-muted">space</text>
    <text x="150" y="264" font-size="11">main-start</text>
    <text x="570" y="264" font-size="11" text-anchor="end">main-end</text>
    <text x="360" y="284" text-anchor="middle" class="d-fill-0">main axis: justify-content</text>
    <text x="118" y="52" font-size="11" text-anchor="middle">cross-start</text>
    <text x="118" y="236" font-size="11" text-anchor="middle">cross-end</text>
    <text transform="translate(44 140) rotate(-90)" text-anchor="middle" class="d-fill-1">cross axis: align-items</text>
    <text x="300" y="304" text-anchor="middle" font-size="11" class="d-muted">flex-direction: column swaps the two axes</text>
  </g>
</svg>
