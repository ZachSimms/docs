<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" fill="none" stroke="currentColor">
  <defs>
    <marker id="rt-fan-out-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>
  <rect class="d-muted" x="8" y="8" width="286" height="290" rx="6" stroke-width="1"/>
  <rect class="d-fill-0 d-tint d-stroke-0" x="24" y="66" width="72" height="28" rx="5" stroke-width="1.5"/>
  <rect class="d-bg" x="113" y="66" width="72" height="28" rx="5" stroke-width="1.5"/>
  <rect class="d-bg" x="202" y="66" width="72" height="28" rx="5" stroke-width="1.5"/>
  <rect class="d-chip" x="30" y="134" width="100" height="30" rx="5" stroke-width="1.5"/>
  <rect class="d-chip" x="164" y="134" width="100" height="30" rx="5" stroke-width="1.5"/>
  <rect class="d-bg" x="54" y="214" width="186" height="32" rx="5" stroke-width="1.5"/>
  <path class="d-stroke-0" stroke-width="1.5" d="M60 96 L 74 132" marker-end="url(#rt-fan-out-arrow)"/>
  <path class="d-stroke-0" stroke-width="1.5" d="M84 166 L 118 212" marker-end="url(#rt-fan-out-arrow)"/>
  <path class="d-stroke-1" stroke-width="1.5" d="M178 212 L 206 166" marker-end="url(#rt-fan-out-arrow)"/>
  <path class="d-stroke-1" stroke-width="1.5" d="M200 132 L 158 96" marker-end="url(#rt-fan-out-arrow)"/>
  <path class="d-stroke-1" stroke-width="1.5" d="M228 132 L 236 96" marker-end="url(#rt-fan-out-arrow)"/>
  <rect class="d-muted" x="306" y="8" width="286" height="290" rx="6" stroke-width="1"/>
  <rect class="d-fill-0 d-tint d-stroke-0" x="322" y="66" width="72" height="28" rx="5" stroke-width="1.5"/>
  <rect class="d-bg" x="411" y="66" width="72" height="28" rx="5" stroke-width="1.5"/>
  <rect class="d-bg" x="500" y="66" width="72" height="28" rx="5" stroke-width="1.5"/>
  <rect class="d-chip" x="366" y="144" width="160" height="44" rx="5" stroke-width="1.5"/>
  <rect class="d-bg" x="396" y="224" width="100" height="28" rx="5" stroke-width="1.5"/>
  <path class="d-stroke-0" stroke-width="1.5" d="M362 96 L 404 142" marker-end="url(#rt-fan-out-arrow)"/>
  <path class="d-stroke-1" stroke-width="1.5" d="M447 142 V 98" marker-end="url(#rt-fan-out-arrow)"/>
  <path class="d-stroke-1" stroke-width="1.5" d="M492 142 L 530 98" marker-end="url(#rt-fan-out-arrow)"/>
  <path stroke-width="1.5" d="M446 190 V 222" marker-end="url(#rt-fan-out-arrow)"/>
  <g fill="currentColor" stroke="none">
    <text x="151" y="30" font-size="13" text-anchor="middle" font-weight="600">Socket.IO + Redis adapter</text>
    <text x="151" y="47" font-size="11" text-anchor="middle" class="d-muted">N app servers share one broker</text>
    <text x="60" y="85" font-size="12" text-anchor="middle" class="d-fill-0" font-weight="600">amy</text>
    <text x="149" y="85" font-size="12" text-anchor="middle">bob</text>
    <text x="238" y="85" font-size="12" text-anchor="middle">cy</text>
    <text x="80" y="154" font-size="12" text-anchor="middle">node A</text>
    <text x="214" y="154" font-size="12" text-anchor="middle">node B</text>
    <text x="147" y="235" font-size="12" text-anchor="middle">Redis pub/sub</text>
    <text x="24" y="122" font-size="11" text-anchor="start" class="d-fill-0">emit</text>
    <text x="36" y="196" font-size="11" text-anchor="start" class="d-fill-0">publish</text>
    <text x="214" y="196" font-size="11" text-anchor="start" class="d-fill-1">relay</text>
    <text x="151" y="272" font-size="11" text-anchor="middle">every node hears every room;</text>
    <text x="151" y="287" font-size="11" text-anchor="middle" class="d-muted">sticky sessions if polling is on</text>
    <text x="449" y="30" font-size="13" text-anchor="middle" font-weight="600">One Durable Object per room</text>
    <text x="449" y="47" font-size="11" text-anchor="middle" class="d-muted">the room's sockets end at one object</text>
    <text x="358" y="85" font-size="12" text-anchor="middle" class="d-fill-0" font-weight="600">amy</text>
    <text x="447" y="85" font-size="12" text-anchor="middle">bob</text>
    <text x="536" y="85" font-size="12" text-anchor="middle">cy</text>
    <text x="446" y="162" font-size="12" text-anchor="middle" font-weight="600">Durable Object</text>
    <text x="446" y="178" font-size="11" text-anchor="middle" class="d-muted">"room:lobby"</text>
    <text x="446" y="243" font-size="12" text-anchor="middle">SQLite</text>
    <text x="322" y="124" font-size="11" text-anchor="start" class="d-fill-0">send</text>
    <text x="520" y="130" font-size="11" text-anchor="start" class="d-fill-1">broadcast</text>
    <text x="449" y="272" font-size="11" text-anchor="middle">no broker: one object orders the room;</text>
    <text x="449" y="287" font-size="11" text-anchor="middle" class="d-muted">a room is capped at one object's speed</text>
    <text x="300" y="320" font-size="11" text-anchor="middle">Same room, same message: amy sends, bob and cy receive.</text>
    <text x="300" y="336" font-size="11" text-anchor="middle" class="d-muted">Left scales by adding nodes; right scales by adding rooms.</text>
  </g>
</svg>
