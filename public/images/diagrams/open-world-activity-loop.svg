<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" fill="none" stroke="currentColor">
  <defs>
    <marker id="open-world-activity-loop-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="d-fill-0" d="M0 0 L10 5 L0 10 z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>
  <g class="d-stroke-0" stroke-width="2" marker-end="url(#open-world-activity-loop-arrow)">
    <path d="M352.6 61.1 A112 112 0 0 1 392.9 97.4"/>
    <path d="M411.7 167.8 A112 112 0 0 1 395.0 219.4"/>
    <path d="M315.6 270.9 A112 112 0 0 1 284.4 270.9"/>
    <path d="M205.0 219.4 A112 112 0 0 1 188.3 167.8"/>
    <path d="M207.1 97.4 A112 112 0 0 1 247.4 61.1"/>
  </g>
  <g class="d-chip" stroke-width="1.5">
    <rect x="252" y="33" width="96" height="30" rx="15"/>
    <rect x="358.5" y="110.4" width="96" height="30" rx="15"/>
    <rect x="317.8" y="235.6" width="96" height="30" rx="15"/>
    <rect x="186.2" y="235.6" width="96" height="30" rx="15"/>
    <rect x="145.5" y="110.4" width="96" height="30" rx="15"/>
  </g>
  <g fill="currentColor" stroke="none" font-size="12" font-weight="bold" text-anchor="middle">
    <text x="300" y="52">1 Spot</text>
    <text x="406.5" y="129.4">2 Travel</text>
    <text x="365.8" y="254.6">3 Detour</text>
    <text x="234.2" y="254.6">4 Arrive</text>
    <text x="193.5" y="129.4">5 Vantage</text>
  </g>
  <g class="d-muted" fill="currentColor" stroke="none" font-size="11">
    <text x="300" y="22" text-anchor="middle">a landmark, smoke or an odd shape on the horizon</text>
    <text x="462" y="129.4">movement is play</text>
    <text x="420" y="254.6">gravity: a nearer pull</text>
    <text x="180" y="254.6" text-anchor="end">loot, lore, a skill</text>
    <text x="139" y="129.4" text-anchor="end">climb up, see more</text>
  </g>
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="300" y="156" font-size="13" font-weight="bold" class="d-fill-0">the loop</text>
    <text x="300" y="173" font-size="11" class="d-muted">each stop shows the next</text>
  </g>
