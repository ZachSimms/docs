<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" fill="none" stroke="currentColor">
  <defs>
    <marker id="css-cascade-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>
  <path class="d-muted" d="M40 42 V 318" marker-end="url(#css-cascade-arrow)"/>
  <rect class="d-fill-1 d-tint" x="70" y="30" width="510" height="34" rx="4"/>
  <rect class="d-chip" x="70" y="72" width="510" height="34" rx="4" stroke="none"/>
  <rect class="d-chip" x="70" y="114" width="510" height="34" rx="4" stroke="none"/>
  <rect class="d-fill-3 d-tint" x="70" y="156" width="510" height="34" rx="4"/>
  <rect class="d-fill-0 d-tint" x="70" y="198" width="510" height="34" rx="4"/>
  <rect class="d-chip" x="70" y="240" width="510" height="34" rx="4" stroke="none"/>
  <rect class="d-fill-2 d-tint" x="70" y="282" width="510" height="34" rx="4"/>
  <g fill="currentColor" stroke="none">
    <text x="20" y="20" font-size="11" class="d-muted">checked first</text>
    <text x="20" y="340" font-size="11" class="d-muted">tie? go down one step; the first step with a difference decides</text>
    <text x="84" y="52">1 origin &amp; importance</text>
    <text x="84" y="94">2 context</text>
    <text x="84" y="136">3 element-attached</text>
    <text x="84" y="178">4 cascade layers</text>
    <text x="84" y="220">5 specificity</text>
    <text x="84" y="262">6 scope proximity</text>
    <text x="84" y="304">7 order of appearance</text>
    <g font-size="11" class="d-muted">
      <text x="566" y="51" text-anchor="end">!important beats normal</text>
      <text x="566" y="93" text-anchor="end">light DOM beats shadow DOM</text>
      <text x="566" y="135" text-anchor="end">style="" beats any selector</text>
      <text x="566" y="177" text-anchor="end">unlayered &gt; last layer &gt; first</text>
      <text x="566" y="219" text-anchor="end">(id, class, type), left first</text>
      <text x="566" y="261" text-anchor="end">nearer @scope root wins</text>
      <text x="566" y="303" text-anchor="end">the later rule wins</text>
    </g>
  </g>
</svg>
