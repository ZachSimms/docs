<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" fill="none" stroke="currentColor">
  <defs>
    <marker id="worldbuilding-rain-shadow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>
  <rect class="d-fill-0 d-tint" stroke="none" x="0" y="240" width="140" height="12"/>
  <path class="d-stroke-0" stroke-width="1.5" d="M0 240 H 140"/>
  <path class="d-fill-2 d-tint d-stroke-2" stroke-width="1.5" d="M140 240 L230 150 L290 70 L330 90 L360 150 L460 240 Z"/>
  <rect class="d-fill-3 d-tint" stroke="none" x="460" y="240" width="140" height="12"/>
  <path stroke-width="1.5" d="M140 240 H 600"/>
  <g class="d-fill-0 d-tint d-stroke-0" stroke-width="1.5">
    <ellipse cx="208" cy="118" rx="30" ry="13"/>
    <ellipse cx="250" cy="96" rx="32" ry="14"/>
  </g>
  <g class="d-stroke-0" stroke-width="1.5" stroke-dasharray="4 4">
    <path d="M190 134 L184 168"/>
    <path d="M204 134 L198 162"/>
    <path d="M218 134 L212 155"/>
    <path d="M238 113 L232 140"/>
    <path d="M254 113 L248 130"/>
  </g>
  <path class="d-stroke-1" stroke-width="2" d="M20 205 H 120 C 180 190, 240 100, 290 50 C 330 40, 350 70, 400 140 C 430 185, 470 205, 580 205" marker-end="url(#worldbuilding-rain-shadow-arrow)"/>
  <g fill="currentColor" stroke="none" font-size="12">
    <text x="20" y="28" font-weight="bold">windward side</text>
    <text x="20" y="46">moist air forced up the slope</text>
    <text x="20" y="64">cools as it rises; clouds form</text>
    <text x="20" y="82">heavy rain and snow fall here</text>
    <text x="590" y="28" text-anchor="end" font-weight="bold">leeward side</text>
    <text x="590" y="46" text-anchor="end">air sinks and warms by compression</text>
    <text x="590" y="64" text-anchor="end">relative humidity falls</text>
    <text x="590" y="82" text-anchor="end">little rain: steppe or desert</text>
    <text x="20" y="226" class="d-fill-1">moist sea wind</text>
    <text x="590" y="226" text-anchor="end" class="d-fill-1">warm, dry wind</text>
    <text x="70" y="268" text-anchor="middle" class="d-muted">sea</text>
    <text x="215" y="268" text-anchor="middle" class="d-muted">wet forested slopes</text>
    <text x="530" y="268" text-anchor="middle" class="d-muted">rain shadow</text>
  </g>
</svg>
