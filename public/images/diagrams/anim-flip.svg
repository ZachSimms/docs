    </marker>
    <marker id="anim-flip-play" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="d-fill-2" stroke="none"/>
    </marker>
  </defs>
  <g class="d-muted">
    <rect x="6" y="36" width="138" height="110" rx="6"/>
    <rect x="156" y="36" width="138" height="110" rx="6"/>
    <rect x="306" y="36" width="138" height="110" rx="6"/>
    <rect x="456" y="36" width="138" height="110" rx="6"/>
  </g>
  <rect class="d-fill-0" x="22" y="66" width="36" height="36" rx="3" stroke="none"/>
  <rect class="d-muted" x="172" y="66" width="36" height="36" rx="3" stroke-dasharray="3 3"/>
  <rect class="d-fill-0" x="242" y="66" width="36" height="36" rx="3" stroke="none"/>
  <rect class="d-muted" x="392" y="66" width="36" height="36" rx="3" stroke-dasharray="3 3"/>
  <rect class="d-fill-0" x="322" y="66" width="36" height="36" rx="3" stroke="none"/>
  <path class="d-stroke-1" stroke-width="2" d="M408 122 H 344" marker-end="url(#anim-flip-back)"/>
  <rect class="d-muted" x="472" y="66" width="36" height="36" rx="3" stroke-dasharray="3 3"/>
  <rect class="d-fill-0" x="542" y="66" width="36" height="36" rx="3" stroke="none"/>
  <path class="d-stroke-2" stroke-width="2" d="M492 122 H 556" marker-end="url(#anim-flip-play)"/>
  <g fill="currentColor" stroke="none">
    <text x="75" y="24" text-anchor="middle"><tspan class="d-fill-0">F</tspan>irst</text>
    <text x="225" y="24" text-anchor="middle"><tspan class="d-fill-0">L</tspan>ast</text>
    <text x="375" y="24" text-anchor="middle"><tspan class="d-fill-0">I</tspan>nvert</text>
    <text x="525" y="24" text-anchor="middle"><tspan class="d-fill-0">P</tspan>lay</text>
    <text x="376" y="138" text-anchor="middle" font-size="11" class="d-fill-1">translate: -dx</text>
    <text x="524" y="138" text-anchor="middle" font-size="11" class="d-fill-2">to 0</text>
    <g font-size="11" text-anchor="middle">
      <text x="75" y="166">read the rect</text>
      <text x="225" y="166">change the DOM,</text>
