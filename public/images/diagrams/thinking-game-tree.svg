<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 332" fill="none" stroke="currentColor">
  <g class="d-muted" stroke-width="1.5">
    <path d="M90 160 L300 70"/>
    <path d="M300 220 L500 160" stroke-dasharray="6 4"/>
  </g>
  <g class="d-stroke-0" stroke-width="3.5" stroke-linecap="round">
    <path d="M90 160 L300 220"/>
    <path d="M300 220 L500 280"/>
  </g>
  <g fill="currentColor" stroke="none">
    <circle cx="90" cy="160" r="6"/>
    <circle cx="300" cy="220" r="6"/>
  </g>
  <g class="d-bg" stroke-width="1.5">
    <circle cx="300" cy="70" r="5"/>
    <circle cx="500" cy="160" r="5"/>
  </g>
  <circle class="d-fill-0 d-stroke-0" cx="500" cy="280" r="5"/>
  <g fill="currentColor" stroke="none" font-size="12">
    <text x="80" y="164" text-anchor="end">Entrant</text>
    <text x="296" y="244" text-anchor="end">Incumbent</text>
    <text x="185" y="108" text-anchor="end">Stay out</text>
    <text x="195" y="212" text-anchor="middle" class="d-fill-0">Enter</text>
    <text x="400" y="176" text-anchor="middle">Fight</text>
    <text x="385" y="277" text-anchor="middle" class="d-fill-0">Accommodate</text>
    <text x="312" y="74">(0, 10)</text>
    <text x="512" y="164">(−2, 2)</text>
    <text x="512" y="284" class="d-fill-0">(3, 5)</text>
    <g class="d-muted" font-size="11">
      <text x="20" y="20">payoffs are (Entrant, Incumbent); the thick path is subgame-perfect play</text>
      <text x="312" y="90">works only if the threat is believed</text>
      <text x="512" y="180">empty threat</text>
      <text x="20" y="306">1. After entry the incumbent compares accommodate (5) with fight (2): it accommodates.</text>
      <text x="20" y="324">2. Anticipating that, the entrant compares enter (3) with stay out (0): it enters.</text>
    </g>
  </g>
</svg>
