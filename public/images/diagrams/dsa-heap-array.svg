<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" fill="none" stroke="currentColor">
  <defs>
    <marker id="dsa-heap-array-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="d-fill-0" stroke="none"/>
    </marker>
  </defs>
  <g class="d-muted" stroke-width="1.5">
    <path d="M300 40 L170 100 M300 40 L430 100 M430 100 L365 160 M430 100 L495 160"/>
  </g>
  <g class="d-stroke-0" stroke-width="2.5">
    <path d="M170 100 L105 160 M170 100 L235 160"/>
  </g>
  <g stroke-width="1.5">
    <circle class="d-bg" cx="300" cy="40" r="18"/>
    <circle class="d-bg" cx="430" cy="100" r="18"/>
    <circle class="d-bg" cx="365" cy="160" r="18"/>
    <circle class="d-bg" cx="495" cy="160" r="18"/>
  </g>
  <g class="d-stroke-0" stroke-width="2">
    <circle class="d-bg" cx="170" cy="100" r="18"/>
    <circle class="d-bg" cx="105" cy="160" r="18"/>
    <circle class="d-bg" cx="235" cy="160" r="18"/>
    <circle class="d-fill-0 d-tint" cx="170" cy="100" r="18"/>
    <circle class="d-fill-0 d-tint" cx="105" cy="160" r="18"/>
    <circle class="d-fill-0 d-tint" cx="235" cy="160" r="18"/>
  </g>
  <g stroke-width="1.5">
    <rect x="90" y="226" width="420" height="40"/>
    <path d="M150 226 V266 M210 226 V266 M270 226 V266 M330 226 V266 M390 226 V266 M450 226 V266"/>
  </g>
  <g class="d-stroke-0" stroke-width="2">
    <rect class="d-fill-0 d-tint" x="150" y="226" width="60" height="40"/>
    <rect class="d-fill-0 d-tint" x="270" y="226" width="120" height="40"/>
    <path d="M180 266 C 190 292 290 292 298 270" marker-end="url(#dsa-heap-array-arrow)"/>
    <path d="M180 266 C 190 326 350 326 358 270" marker-end="url(#dsa-heap-array-arrow)"/>
  </g>
  <g fill="currentColor" stroke="none" font-size="13">
    <text x="300" y="45" text-anchor="middle">1</text>
    <text x="170" y="105" text-anchor="middle">3</text>
    <text x="430" y="105" text-anchor="middle">2</text>
    <text x="105" y="165" text-anchor="middle">7</text>
    <text x="235" y="165" text-anchor="middle">4</text>
    <text x="365" y="165" text-anchor="middle">5</text>
    <text x="495" y="165" text-anchor="middle">6</text>
    <text x="120" y="251" text-anchor="middle">1</text>
    <text x="180" y="251" text-anchor="middle">3</text>
    <text x="240" y="251" text-anchor="middle">2</text>
    <text x="300" y="251" text-anchor="middle">7</text>
    <text x="360" y="251" text-anchor="middle">4</text>
    <text x="420" y="251" text-anchor="middle">5</text>
    <text x="480" y="251" text-anchor="middle">6</text>
    <text x="304" y="286" class="d-fill-0" font-size="12">2i+1</text>
    <text x="366" y="290" class="d-fill-0" font-size="12">2i+2</text>
    <g class="d-muted" font-size="11">
      <text x="324" y="36">i = 0</text>
      <text x="136" y="90" text-anchor="end">i = 1</text>
      <text x="454" y="90">i = 2</text>
      <text x="105" y="192" text-anchor="middle">i = 3</text>
      <text x="235" y="192" text-anchor="middle">i = 4</text>
      <text x="365" y="192" text-anchor="middle">i = 5</text>
      <text x="495" y="192" text-anchor="middle">i = 6</text>
      <text x="120" y="218" text-anchor="middle">[0]</text>
      <text x="180" y="218" text-anchor="middle">[1]</text>
      <text x="240" y="218" text-anchor="middle">[2]</text>
      <text x="300" y="218" text-anchor="middle">[3]</text>
      <text x="360" y="218" text-anchor="middle">[4]</text>
      <text x="420" y="218" text-anchor="middle">[5]</text>
      <text x="480" y="218" text-anchor="middle">[6]</text>
    </g>
    <text x="420" y="296" font-size="12">children of i: 2i+1, 2i+2</text>
    <text x="420" y="314" font-size="12">parent of i: (i − 1) // 2</text>
    <text x="420" y="332" font-size="12" class="d-muted">no pointers stored</text>
