<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 310" fill="none" stroke="currentColor">
  <defs>
    <marker id="rt-prediction-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>
  <path stroke-width="1.5" d="M64 70 H 588" marker-end="url(#rt-prediction-arrow)"/>
  <path stroke-width="1.5" d="M64 190 H 588" marker-end="url(#rt-prediction-arrow)"/>
  <g class="d-stroke-0" stroke-width="1.5">
    <path d="M90 82 L 146 178" marker-end="url(#rt-prediction-arrow)"/>
    <path d="M140 82 L 196 178" marker-end="url(#rt-prediction-arrow)"/>
    <path d="M190 82 L 246 178" marker-end="url(#rt-prediction-arrow)"/>
  </g>
  <g class="d-muted" stroke-width="1.5" stroke-dasharray="5 4">
    <path d="M240 82 L 296 178"/>
    <path d="M290 82 L 346 178"/>
    <path d="M340 82 L 396 178"/>
  </g>
  <path class="d-stroke-1" stroke-width="2.5" d="M262 180 L 396 84" marker-end="url(#rt-prediction-arrow)"/>
  <g class="d-fill-0 d-tint d-stroke-0" stroke-width="1.5">
    <circle cx="90" cy="70" r="11"/>
    <circle cx="140" cy="70" r="11"/>
    <circle cx="190" cy="70" r="11"/>
    <circle cx="240" cy="70" r="11"/>
    <circle cx="290" cy="70" r="11"/>
    <circle cx="340" cy="70" r="11"/>
  </g>
  <g class="d-chip" stroke-width="1.5">
    <rect x="139" y="179" width="22" height="22" rx="4"/>
    <rect x="189" y="179" width="22" height="22" rx="4"/>
    <rect x="239" y="179" width="22" height="22" rx="4"/>
  </g>
  <g class="d-bg d-muted" stroke-width="1.2" stroke-dasharray="3 3">
    <rect x="289" y="179" width="22" height="22" rx="4"/>
    <rect x="339" y="179" width="22" height="22" rx="4"/>
    <rect x="389" y="179" width="22" height="22" rx="4"/>
  </g>
  <circle class="d-fill-1 d-stroke-1" cx="400" cy="70" r="6"/>
  <rect class="d-bg d-stroke-1" x="420" y="90" width="170" height="86" rx="6" stroke-width="1.5"/>
  <g class="d-muted d-bg" stroke-width="1.2">
    <rect x="90" y="250" width="22" height="20" rx="4"/>
    <rect x="116" y="250" width="22" height="20" rx="4"/>
    <rect x="142" y="250" width="22" height="20" rx="4"/>
  </g>
  <g class="d-fill-0 d-tint d-stroke-0" stroke-width="1.2">
    <rect x="168" y="250" width="22" height="20" rx="4"/>
    <rect x="194" y="250" width="22" height="20" rx="4"/>
    <rect x="220" y="250" width="22" height="20" rx="4"/>
    <rect x="300" y="250" width="22" height="20" rx="4"/>
    <rect x="326" y="250" width="22" height="20" rx="4"/>
    <rect x="352" y="250" width="22" height="20" rx="4"/>
  </g>
  <path stroke-width="1.5" d="M252 260 H 290" marker-end="url(#rt-prediction-arrow)"/>
  <g fill="currentColor" stroke="none">
    <text x="300" y="22" font-size="13" text-anchor="middle" font-weight="600">Client-side prediction and server reconciliation</text>
    <text x="215" y="48" font-size="11" text-anchor="middle" class="d-fill-0">predict locally, then send inputs 1 … 6</text>
    <text x="16" y="74" font-size="12" font-weight="600">client</text>
    <text x="16" y="194" font-size="12" font-weight="600">server</text>
    <text x="588" y="62" font-size="11" text-anchor="end" class="d-muted">time →</text>
    <g font-size="12" text-anchor="middle">
      <text x="90" y="74">1</text>
      <text x="140" y="74">2</text>
      <text x="190" y="74">3</text>
      <text x="240" y="74">4</text>
      <text x="290" y="74">5</text>
      <text x="340" y="74">6</text>
      <text x="150" y="194">1</text>
      <text x="200" y="194">2</text>
      <text x="250" y="194">3</text>
    </g>
    <g font-size="12" text-anchor="middle" class="d-muted">
      <text x="300" y="194">4</text>
      <text x="350" y="194">5</text>
      <text x="400" y="194">6</text>
    </g>
    <text x="195" y="220" font-size="11" text-anchor="middle" class="d-fill-1">applies 1–3, sends state + ack 3</text>
    <text x="350" y="220" font-size="11" text-anchor="middle" class="d-muted">4–6 still in flight</text>
    <text x="430" y="110" font-size="12" font-weight="600" class="d-fill-1">snapshot arrives</text>
    <text x="430" y="128" font-size="11">1. drop acked inputs 1–3</text>
    <text x="430" y="145" font-size="11">2. reset to the server state</text>
    <text x="430" y="162" font-size="11">3. replay 4, 5, 6 on top</text>
    <text x="16" y="264" font-size="12" font-weight="600">pending</text>
    <g font-size="11" text-anchor="middle">
      <text x="101" y="264" class="d-muted">1</text>
      <text x="127" y="264" class="d-muted">2</text>
      <text x="153" y="264" class="d-muted">3</text>
      <text x="179" y="264">4</text>
      <text x="205" y="264">5</text>
      <text x="231" y="264">6</text>
      <text x="311" y="264">4</text>
      <text x="337" y="264">5</text>
      <text x="363" y="264">6</text>
    </g>
    <text x="384" y="264" font-size="11">kept, replayed each snapshot</text>
    <text x="300" y="298" font-size="11" text-anchor="middle" class="d-muted">If the server disagrees (a wall, a hit), the replay starts from its answer: the server stays in charge.</text>
  </g>
</svg>
