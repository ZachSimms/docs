  </g>
  <g fill="currentColor" stroke="none" font-size="13">
    <text x="30" y="24" font-weight="bold">Array: one contiguous block</text>
    <text x="60" y="75" text-anchor="middle">7</text>
    <text x="120" y="75" text-anchor="middle">3</text>
    <text x="180" y="75" text-anchor="middle">9</text>
    <text x="240" y="75" text-anchor="middle">4</text>
    <text x="300" y="75" text-anchor="middle">1</text>
    <text x="360" y="75" text-anchor="middle">8</text>
    <text x="408" y="66">xs[i] = base + i × size</text>
    <text x="408" y="84" class="d-fill-0">O(1) jump to any index</text>
    <text x="30" y="148" font-weight="bold">Linked list: nodes anywhere, joined by pointers</text>
    <text x="53" y="219" text-anchor="middle">7</text>
    <text x="193" y="249" text-anchor="middle">3</text>
    <text x="333" y="209" text-anchor="middle">9</text>
    <text x="473" y="239" text-anchor="middle">4</text>
    <text x="545" y="238">null</text>
    <text x="8" y="162">head</text>
    <g class="d-muted" font-size="11">
      <text x="60" y="40" text-anchor="middle">1000</text>
      <text x="120" y="40" text-anchor="middle">1008</text>
      <text x="180" y="40" text-anchor="middle">1016</text>
      <text x="240" y="40" text-anchor="middle">1024</text>
      <text x="300" y="40" text-anchor="middle">1032</text>
      <text x="360" y="40" text-anchor="middle">1040</text>
      <text x="60" y="108" text-anchor="middle">[0]</text>
      <text x="120" y="108" text-anchor="middle">[1]</text>
      <text x="180" y="108" text-anchor="middle">[2]</text>
      <text x="240" y="108" text-anchor="middle">[3]</text>
      <text x="300" y="108" text-anchor="middle">[4]</text>
      <text x="360" y="108" text-anchor="middle">[5]</text>
      <text x="53" y="188" text-anchor="middle">val</text>
      <text x="91" y="188" text-anchor="middle">next</text>
      <text x="408" y="102">insert in the middle: shift the tail, O(n)</text>
