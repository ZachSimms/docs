<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" fill="none" stroke="currentColor">
  <defs>
    <marker id="dsa-two-pointers-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>
  <rect class="d-fill-2 d-tint" stroke="none" x="112" y="40" width="48" height="40"/>
  <rect class="d-fill-2 d-tint" stroke="none" x="160" y="40" width="48" height="40"/>
  <rect class="d-muted" x="16" y="40" width="48" height="40"/>
  <rect class="d-muted" x="64" y="40" width="48" height="40"/>
  <rect class="d-muted" x="112" y="40" width="48" height="40"/>
  <rect class="d-muted" x="160" y="40" width="48" height="40"/>
  <rect class="d-muted" x="208" y="40" width="48" height="40"/>
  <rect class="d-muted" x="256" y="40" width="48" height="40"/>
  <g class="d-stroke-0" stroke-width="1.8">
    <path d="M46 116 H78" marker-end="url(#dsa-two-pointers-arrow)"/>
    <path d="M94 116 H126" marker-end="url(#dsa-two-pointers-arrow)"/>
  </g>
  <g class="d-stroke-3" stroke-width="1.8">
    <path d="M274 146 H242" marker-end="url(#dsa-two-pointers-arrow)"/>
    <path d="M226 146 H194" marker-end="url(#dsa-two-pointers-arrow)"/>
  </g>
  <g fill="currentColor" stroke="none">
    <g text-anchor="middle">
      <text x="40" y="66" font-size="15">1</text>
      <text x="40" y="96" font-size="11" class="d-muted">0</text>
      <text x="88" y="66" font-size="15">3</text>
      <text x="88" y="96" font-size="11" class="d-muted">1</text>
      <text x="136" y="66" font-size="15">4</text>
      <text x="136" y="96" font-size="11" class="d-muted">2</text>
      <text x="184" y="66" font-size="15">6</text>
      <text x="184" y="96" font-size="11" class="d-muted">3</text>
      <text x="232" y="66" font-size="15">8</text>
      <text x="232" y="96" font-size="11" class="d-muted">4</text>
      <text x="280" y="66" font-size="15">11</text>
      <text x="280" y="96" font-size="11" class="d-muted">5</text>
    </g>
    <circle class="d-fill-0" cx="40" cy="116" r="4"/>
    <circle class="d-fill-0" cx="88" cy="116" r="4"/>
    <circle class="d-fill-0" cx="136" cy="116" r="4"/>
    <circle class="d-fill-3" cx="280" cy="146" r="4"/>
    <circle class="d-fill-3" cx="232" cy="146" r="4"/>
    <circle class="d-fill-3" cx="184" cy="146" r="4"/>
    <text x="40" y="136" font-size="12" class="d-fill-0" text-anchor="middle">lo</text>
    <text x="280" y="166" font-size="12" class="d-fill-3" text-anchor="middle">hi</text>
    <text x="16" y="22" font-size="11" class="d-muted">sorted xs, target 10</text>
    <g font-size="12">
      <text x="332" y="56">1 + 11 = 12</text>
      <text x="424" y="56" class="d-muted">too big</text>
      <text x="492" y="56" class="d-fill-3">hi moves left</text>
      <text x="332" y="80">1 + 8 = 9</text>
      <text x="424" y="80" class="d-muted">too small</text>
      <text x="492" y="80" class="d-fill-0">lo moves right</text>
      <text x="332" y="104">3 + 8 = 11</text>
      <text x="424" y="104" class="d-muted">too big</text>
      <text x="492" y="104" class="d-fill-3">hi moves left</text>
      <text x="332" y="128">3 + 6 = 9</text>
      <text x="424" y="128" class="d-muted">too small</text>
      <text x="492" y="128" class="d-fill-0">lo moves right</text>
      <text x="332" y="152">4 + 6 = 10</text>
      <text x="424" y="152" class="d-muted">found</text>
      <text x="492" y="152" class="d-fill-2">return [2, 3]</text>
    </g>
    <text x="16" y="190" font-size="11" class="d-muted">each step discards a whole row or column of pairs, so n − 1 steps at most</text>
  </g>
</svg>
