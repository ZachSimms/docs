<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" fill="none" stroke="currentColor">
  <defs>
    <marker id="dsa-stack-queue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="d-fill-1" stroke="none"/>
    </marker>
  </defs>
  <g stroke-width="1.5">
    <path d="M40 60 V 216 H 140 V 60"/>
    <rect x="46" y="176" width="88" height="34" rx="3"/>
    <rect x="46" y="138" width="88" height="34" rx="3"/>
    <rect x="46" y="100" width="88" height="34" rx="3"/>
    <rect class="d-fill-0 d-tint d-stroke-0" x="46" y="62" width="88" height="34" rx="3"/>
    <path d="M330 104 H 560 M330 148 H 560"/>
    <rect class="d-fill-2 d-tint d-stroke-2" x="336" y="108" width="50" height="36" rx="3"/>
    <rect x="392" y="108" width="50" height="36" rx="3"/>
    <rect x="448" y="108" width="50" height="36" rx="3"/>
    <rect x="504" y="108" width="50" height="36" rx="3"/>
  </g>
  <g class="d-stroke-1" stroke-width="2">
    <path d="M200 50 C 170 50 150 60 138 72" marker-end="url(#dsa-stack-queue-arrow)"/>
    <path d="M138 86 C 150 98 170 104 200 104" marker-end="url(#dsa-stack-queue-arrow)"/>
    <path d="M596 126 H 564" marker-end="url(#dsa-stack-queue-arrow)"/>
    <path d="M326 126 H 290" marker-end="url(#dsa-stack-queue-arrow)"/>
  </g>
  <g fill="currentColor" stroke="none" font-size="13">
    <text x="40" y="24" font-weight="bold">Stack: last in, first out</text>
    <text x="90" y="84" text-anchor="middle">D (top)</text>
    <text x="90" y="122" text-anchor="middle">C</text>
    <text x="90" y="160" text-anchor="middle">B</text>
    <text x="90" y="198" text-anchor="middle">A</text>
    <text x="206" y="54">push</text>
    <text x="206" y="108">pop</text>
    <text x="290" y="24" font-weight="bold">Queue: first in, first out</text>
    <text x="361" y="131" text-anchor="middle">A</text>
    <text x="417" y="131" text-anchor="middle">B</text>
    <text x="473" y="131" text-anchor="middle">C</text>
    <text x="529" y="131" text-anchor="middle">D</text>
    <text x="361" y="94" text-anchor="middle">front</text>
    <text x="529" y="94" text-anchor="middle">back</text>
    <g class="d-muted" font-size="12">
      <text x="40" y="236">JS: push / pop / at(-1)</text>
      <text x="40" y="252">Python: append / pop / [-1]</text>
      <text x="290" y="170">dequeue at the front, enqueue at the back</text>
      <text x="290" y="200">JS: Deque pushBack / popFront</text>
      <text x="290" y="216">Python: deque append / popleft</text>
      <text x="290" y="244">a deque pushes and pops at both ends in O(1)</text>
    </g>
  </g>
</svg>
