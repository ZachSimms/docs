<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 270" fill="none" stroke="currentColor">
  <rect class="d-fill-0 d-tint" x="330" y="30" width="160" height="140" rx="4"/>
  <rect class="d-fill-3" x="430" y="80" width="110" height="46" rx="4" stroke="none"/>
  <rect class="d-bg" x="410" y="110" width="170" height="120" rx="4" stroke="none"/>
  <rect class="d-fill-1 d-tint" x="410" y="110" width="170" height="120" rx="4"/>
  <g fill="currentColor" stroke="none">
    <text x="20" y="44">root stacking context</text>
    <text x="20" y="74" class="d-fill-0">├ A   z-index: 1</text>
    <text x="20" y="100" class="d-fill-3">│  └ badge  z-index: 999</text>
    <text x="20" y="126" class="d-fill-1">└ B   z-index: 2</text>
    <text x="344" y="52">A</text>
    <text x="344" y="70" font-size="11">z-index: 1</text>
    <text x="440" y="100" class="d-bg">badge 999</text>
    <text x="566" y="204" text-anchor="end">B</text>
    <text x="566" y="222" text-anchor="end" font-size="11">z-index: 2</text>
    <text x="20" y="160" font-size="11" class="d-muted">A creates a context, so 999</text>
    <text x="20" y="176" font-size="11" class="d-muted">only ranks the badge among</text>
    <text x="20" y="192" font-size="11" class="d-muted">A's own children</text>
    <text x="300" y="258" text-anchor="middle" font-size="11" class="d-muted">siblings A (1) and B (2) decide the order, so B covers the badge</text>
  </g>
</svg>
