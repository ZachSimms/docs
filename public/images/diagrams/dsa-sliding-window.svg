  <g fill="currentColor" stroke="none">
    <text x="16" y="22" font-size="11" class="d-muted">s = "abcabcbb", rule: no letter twice in the window [l, r]</text>
    <text x="16" y="62" font-size="13">1. expand</text>
    <text x="16" y="79" font-size="11" class="d-muted">add s[r]</text>
    <text x="16" y="212" font-size="13">2. shrink</text>
    <text x="16" y="229" font-size="11" class="d-muted">while invalid</text>
    <text x="130" y="158" font-size="12" class="d-fill-1">r = 3 adds a second "a": window abca is invalid</text>
    <text x="182" y="170" font-size="12" class="d-fill-0" text-anchor="middle">l++</text>
    <text x="130" y="308" font-size="12" class="d-fill-0">drop s[0]: bca is valid, record r − l + 1 = 3</text>
  </g>
