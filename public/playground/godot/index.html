<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playground runner</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #161616; }
  canvas { display: block; width: 100%; height: 100%; outline: none; }
</style>

</head>
<body>
<canvas id="canvas" tabindex="-1">Your browser can't run the Godot engine.</canvas>
<script src="index.js"></script>
<script>
// The playground's Godot runner shell. It runs in <iframe sandbox="allow-scripts">
// (an opaque origin), obeys only its parent, and tags every message with the run's token.
(function () {
  const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":4568,"index.wasm":37902138},"focusCanvas":false,"gdextensionLibs":[],"godotPoolSize":4};
  let token = null;
  let queued = null;
  let started = false;
  let echo = false; // the engine's own start-up lines are not program output
  const post = (message) => parent.postMessage(Object.assign({}, message, { token }), "*");
  const text = (args) => args.map(String).join(" ") + "\n";

  function run(command) {
    echo = true;
    post({ type: "progress", text: "running" });
    window.godotRun(JSON.stringify(command.files), command.entry);
  }

  window.godotReady = function () {
    if (queued) {
      const command = queued;
      queued = null;
      run(command);
    }
  };
  window.godotDone = function (code) {
    post({ type: "done", exitCode: typeof code === "number" ? code : 0 });
  };

  function start() {
    if (started) return;
    started = true;
    const engine = new Engine(GODOT_CONFIG);
    engine
      .startGame({
        persistentPaths: [], // no IndexedDB at an opaque origin
        onPrint: (...args) => echo && post({ type: "out", stream: "stdout", text: text(args) }),
        onPrintError: (...args) => echo && post({ type: "out", stream: "stderr", text: text(args) }),
        onProgress: (current, total) => {
          if (total > 0) post({ type: "progress", text: "loading Godot… " + Math.round((current / total) * 100) + "%" });
        },
      })
      .catch((error) => {
        post({ type: "out", stream: "stderr", text: "Godot couldn't start in this browser: " + error + "\n" });
        post({ type: "done", exitCode: null });
      });
  }

  addEventListener("message", (event) => {
    if (event.source !== parent) return;
    const command = event.data;
    if (!command || command.type !== "run" || typeof command.token !== "string") return;
    if (typeof command.entry !== "string" || typeof command.files !== "object") return;
    token = command.token;
    if (window.godotRun) run(command);
    else {
      queued = command;
      start();
    }
  });

  parent.postMessage({ type: "ready" }, "*");
})();
</script>
</body>
</html>
