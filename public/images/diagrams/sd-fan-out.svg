<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" fill="none" stroke="currentColor">
  <defs>
    <marker id="sd-fan-out-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>
  <rect class="d-muted" x="8" y="8" width="286" height="290" rx="6" stroke-width="1"/>
  <rect class="d-fill-0 d-tint d-stroke-0" x="24" y="64" width="80" height="28" rx="5" stroke-width="1.5"/>
  <rect class="d-bg" x="158" y="64" width="110" height="28" rx="5" stroke-width="1.5"/>
  <path stroke-width="1.5" d="M106 78 H 156" marker-end="url(#sd-fan-out-arrow)"/>
  <rect class="d-chip" x="22" y="150" width="78" height="30" rx="5" stroke-width="1.5"/>
  <path class="d-stroke-0" stroke-width="1.5" d="M193 93 L 61 148" marker-end="url(#sd-fan-out-arrow)"/>
  <rect class="d-fill-0" stroke="none" x="28" y="184" width="66" height="6" rx="2"/>
  <rect class="d-chip" x="112" y="150" width="78" height="30" rx="5" stroke-width="1.5"/>
  <path class="d-stroke-0" stroke-width="1.5" d="M213 93 L 151 148" marker-end="url(#sd-fan-out-arrow)"/>
  <rect class="d-fill-0" stroke="none" x="118" y="184" width="66" height="6" rx="2"/>
  <rect class="d-chip" x="202" y="150" width="78" height="30" rx="5" stroke-width="1.5"/>
  <path class="d-stroke-0" stroke-width="1.5" d="M233 93 L 241 148" marker-end="url(#sd-fan-out-arrow)"/>
  <rect class="d-fill-0" stroke="none" x="208" y="184" width="66" height="6" rx="2"/>
  <rect class="d-bg" x="22" y="226" width="78" height="28" rx="5" stroke-width="1.5"/>
  <path stroke-width="1.5" d="M61 224 V 194" marker-end="url(#sd-fan-out-arrow)"/>
  <rect class="d-muted" x="306" y="8" width="286" height="290" rx="6" stroke-width="1"/>
  <rect class="d-fill-0 d-tint d-stroke-0" x="320" y="110" width="78" height="30" rx="5" stroke-width="1.5"/>
  <rect class="d-chip" x="410" y="110" width="78" height="30" rx="5" stroke-width="1.5"/>
  <rect class="d-chip" x="500" y="110" width="78" height="30" rx="5" stroke-width="1.5"/>
  <rect class="d-fill-0 d-tint d-stroke-0" x="322" y="60" width="80" height="28" rx="5" stroke-width="1.5"/>
  <path class="d-stroke-0" stroke-width="1.5" d="M362 89 V 108" marker-end="url(#sd-fan-out-arrow)"/>
  <rect class="d-bg" x="396" y="200" width="106" height="28" rx="5" stroke-width="1.5"/>
  <path class="d-stroke-1" stroke-width="1.5" d="M425 198 L 359 142" marker-end="url(#sd-fan-out-arrow)"/>
  <path class="d-stroke-1" stroke-width="1.5" d="M449 198 L 449 142" marker-end="url(#sd-fan-out-arrow)"/>
  <path class="d-stroke-1" stroke-width="1.5" d="M473 198 L 539 142" marker-end="url(#sd-fan-out-arrow)"/>
  <rect class="d-bg" x="396" y="240" width="106" height="26" rx="5" stroke-width="1.5"/>
  <path stroke-width="1.5" d="M449 238 V 230" marker-end="url(#sd-fan-out-arrow)"/>
  <g fill="currentColor" stroke="none">
    <text x="151" y="30" font-size="13" text-anchor="middle" font-weight="600">Fan-out on write (push)</text>
    <text x="151" y="47" font-size="11" text-anchor="middle" class="d-muted">precompute every follower's feed</text>
    <text x="64" y="83" font-size="12" text-anchor="middle" class="d-fill-0" font-weight="600">amy posts</text>
    <text x="213" y="83" font-size="12" text-anchor="middle">fan-out workers</text>
    <text x="131" y="72" font-size="11" text-anchor="middle" class="d-muted">queue</text>
    <text x="61" y="170" font-size="12" text-anchor="middle">feed:bob</text>
    <text x="151" y="170" font-size="12" text-anchor="middle">feed:cy</text>
    <text x="241" y="170" font-size="12" text-anchor="middle">feed:dan</text>
    <text x="112" y="212" font-size="11" text-anchor="start" class="d-fill-0">1 write per follower</text>
    <text x="61" y="245" font-size="12" text-anchor="middle">bob reads</text>
    <text x="112" y="246" font-size="11" text-anchor="start">1 key lookup: fast reads</text>
    <text x="151" y="276" font-size="11" text-anchor="middle">cost: a post by someone with 10M</text>
    <text x="151" y="290" font-size="11" text-anchor="middle" class="d-muted">followers means 10M writes</text>
    <text x="449" y="30" font-size="13" text-anchor="middle" font-weight="600">Fan-out on read (pull)</text>
    <text x="449" y="47" font-size="11" text-anchor="middle" class="d-muted">build the feed when it is requested</text>
    <text x="359" y="130" font-size="12" text-anchor="middle" class="d-fill-0" font-weight="600">posts:amy</text>
    <text x="449" y="130" font-size="12" text-anchor="middle">posts:eve</text>
    <text x="539" y="130" font-size="12" text-anchor="middle">posts:max</text>
    <text x="362" y="79" font-size="12" text-anchor="middle" class="d-fill-0" font-weight="600">amy posts</text>
    <text x="410" y="80" font-size="11" text-anchor="start" class="d-fill-0">1 write, nothing else</text>
    <text x="449" y="219" font-size="12" text-anchor="middle">merge + sort</text>
    <text x="320" y="172" font-size="11" text-anchor="start" class="d-fill-1">query each</text>
    <text x="320" y="186" font-size="11" text-anchor="start" class="d-fill-1">followee</text>
    <text x="449" y="258" font-size="12" text-anchor="middle">bob reads</text>
    <text x="449" y="286" font-size="11" text-anchor="middle" class="d-muted">cost: slow reads if bob follows 1,000</text>
    <text x="300" y="320" font-size="11" text-anchor="middle">Hybrid (the usual answer): push for ordinary authors, pull for celebrities,</text>
    <text x="300" y="338" font-size="11" text-anchor="middle" class="d-muted">and merge the two at read time. Bars under each feed = cached post IDs.</text>
  </g>
</svg>
