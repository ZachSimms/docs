<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" fill="none" stroke="currentColor">
  <path class="d-fill-1 d-tint" stroke="none" d="M50 250 L150 250 L150 150 L50 150 Z"/>
  <path class="d-fill-1 d-tint" stroke="none" d="M150 250 L195 215 L195 115 L150 150 Z"/>
  <path class="d-fill-2 d-tint" stroke="none" d="M50 150 L150 150 L195 115 L95 115 Z"/>
  <g class="d-muted" stroke-width="1.2" stroke-dasharray="4 4">
    <path d="M95 215 L95 115"/>
  </g>
  <g stroke-width="1.5">
    <path d="M50 250 L50 150"/>
    <path d="M195 215 L195 115"/>
  </g>
  <g class="d-stroke-0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M50 150 L150 150 L195 115 L95 115 Z"/>
    <path d="M50 250 L150 250 L195 215"/>
    <path d="M150 250 L150 150"/>
  </g>
  <g class="d-stroke-0" stroke-width="2.5" stroke-dasharray="6 5">
    <path d="M195 215 L95 215 L50 250"/>
  </g>
  <g stroke-width="2" stroke-linecap="round">
    <path d="M222 190 H 276"/>
    <path d="M268 184 L 277 190 L 268 196"/>
  </g>
  <path class="d-muted" stroke-width="1.5" d="M320 290 H 570 M320 290 V 40"/>
  <rect class="d-muted" x="320" y="50" width="240" height="240" stroke-dasharray="3 4"/>
  <rect class="d-fill-1 d-tint" stroke="none" x="328" y="214" width="224" height="56"/>
  <rect class="d-fill-2 d-tint" stroke="none" x="356" y="120" width="56" height="56"/>
  <rect class="d-fill-3 d-tint" stroke="none" x="468" y="120" width="56" height="56"/>
  <g stroke-width="1.2">
    <path d="M384 214 V 270 M440 214 V 270 M496 214 V 270"/>
  </g>
  <g class="d-stroke-0" stroke-width="3" stroke-linejoin="round">
    <rect x="328" y="214" width="224" height="56"/>
    <rect x="356" y="120" width="56" height="56"/>
    <rect x="468" y="120" width="56" height="56"/>
  </g>
  <g fill="currentColor" stroke="none" font-size="12">
    <text x="20" y="24" font-size="13">1. Mark seams (Ctrl+E)</text>
    <text x="320" y="24" font-size="13">2. Unwrap (U): islands in 0–1</text>
    <text x="124" y="190" text-anchor="middle">side</text>
    <text x="172" y="190" text-anchor="middle">side</text>
    <text x="122" y="138" text-anchor="middle">top</text>
    <text x="165" y="276" text-anchor="middle" class="d-fill-0">seam = a cut</text>
    <text x="249" y="178" text-anchor="middle" font-size="11" class="d-muted">flatten</text>
    <text x="440" y="203" text-anchor="middle">4 sides: one strip island</text>
    <text x="384" y="152" text-anchor="middle">top</text>
    <text x="496" y="152" text-anchor="middle">bottom</text>
    <text x="316" y="304" text-anchor="end" font-size="11" class="d-muted">(0,0)</text>
    <text x="560" y="44" text-anchor="middle" font-size="11" class="d-muted">(1,1)</text>
    <text x="574" y="294" font-size="11" class="d-muted">U</text>
    <text x="316" y="38" text-anchor="end" font-size="11" class="d-muted">V</text>
    <g font-size="11" class="d-muted">
      <text x="20" y="326">Dashed lines are hidden edges. The vertical seam opens the strip;</text>
      <text x="20" y="342">the loops around the top and bottom cut off the caps. Seams become island borders.</text>
    </g>
  </g>
</svg>
