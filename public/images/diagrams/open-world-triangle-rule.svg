<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" fill="none" stroke="currentColor">
  <defs>
    <marker id="open-world-triangle-rule-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="d-fill-0" d="M0 0 L10 5 L0 10 z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>
  <path class="d-bg" stroke-width="1.5" d="M350 250 L470 70 L590 250 Z"/>
  <path class="d-fill-3 d-tint" stroke="none" d="M350 250 L470 70 L590 250 Z"/>
  <rect class="d-fill-1" stroke="none" x="276" y="110" width="14" height="140"/>
  <rect class="d-fill-1" stroke="none" x="270" y="98" width="26" height="12"/>
  <path class="d-fill-1" stroke="none" d="M270 98 V 92 H 275 V 98 M280.5 98 V 92 H 285.5 V 98 M291 98 V 92 H 296 V 98 Z"/>
  <path class="d-bg" stroke-width="1.5" d="M190 250 L285 150 L380 250 Z"/>
  <path class="d-fill-2 d-tint" stroke="none" d="M190 250 L285 150 L380 250 Z"/>
  <path class="d-bg" stroke-width="1.5" d="M80 250 L135 226 L190 250 Z"/>
  <path class="d-fill-2 d-tint" stroke="none" d="M80 250 L135 226 L190 250 Z"/>
  <path class="d-muted" stroke-width="1.5" d="M15 250 H 590"/>
  <circle class="d-fill-0" stroke="none" cx="40" cy="228" r="5"/>
  <path class="d-stroke-0" stroke-width="2" stroke-linecap="round" d="M40 233 V 245 M40 245 L36 250 M40 245 L44 250"/>
  <path class="d-muted" stroke-width="1.5" stroke-dasharray="4 4" d="M44 227 L278 96"/>
  <path class="d-stroke-0" stroke-width="2" d="M198 227 L255 167" marker-end="url(#open-world-triangle-rule-arrow)"/>
  <path class="d-stroke-0" stroke-width="2" stroke-dasharray="5 4" d="M200 260 Q285 290 372 260" marker-end="url(#open-world-triangle-rule-arrow)"/>
  <g fill="currentColor" stroke="none" font-size="12">
    <text x="135" y="216" text-anchor="middle" font-weight="bold">small</text>
    <text x="285" y="206" text-anchor="middle" font-weight="bold">medium</text>
    <text x="285" y="222" text-anchor="middle" font-size="11">climb or detour</text>
    <text x="490" y="40" font-weight="bold">large</text>
    <text x="490" y="55" font-size="11">seen from afar,</text>
    <text x="490" y="69" font-size="11">sets a goal</text>
    <text x="300" y="86" font-weight="bold">landmark</text>
    <text x="300" y="101" font-size="11">only its top shows;</text>
    <text x="300" y="115" font-size="11">its base is hidden</text>
    <text x="205" y="200" text-anchor="end" class="d-fill-0">climb</text>
    <text x="285" y="294" text-anchor="middle" font-size="11" class="d-fill-0">or go around</text>
    <text x="40" y="266" text-anchor="middle" font-size="11" class="d-muted">player</text>
    <text x="150" y="160" font-size="11" class="d-muted" transform="rotate(-29 150 160)">sightline</text>
  </g>
  <g class="d-muted" fill="currentColor" stroke="none" font-size="11">
    <text x="20" y="28">Each ridge hides what lies beyond it:</text>
    <text x="20" y="43">see a peak, choose to climb or go around,</text>
    <text x="20" y="58">and find the rest on the way.</text>
  </g>
</svg>
