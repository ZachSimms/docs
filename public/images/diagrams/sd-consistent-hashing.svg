<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none" stroke="currentColor">
  <defs>
    <marker id="sd-consistent-hashing-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>
  <circle class="d-muted" cx="190" cy="200" r="125" stroke-width="2"/>
  <path class="d-stroke-0" stroke-width="5" stroke-linecap="round" d="M160.8 90.9 A 113 113 0 0 1 203.8 87.8"/>
  <path class="d-stroke-1" stroke-width="5" stroke-linecap="round" d="M215.4 89.9 A 113 113 0 0 1 272.6 122.9"/>
  <path class="d-stroke-2" stroke-width="5" stroke-linecap="round" d="M280.2 132.0 A 113 113 0 0 1 302.9 203.9"/>
  <path class="d-stroke-0" stroke-width="5" stroke-linecap="round" d="M301.9 215.7 A 113 113 0 0 1 267.1 282.6"/>
  <path class="d-stroke-2" stroke-width="5" stroke-linecap="round" d="M258.0 290.2 A 113 113 0 0 1 186.1 312.9"/>
  <path class="d-stroke-1" stroke-width="5" stroke-linecap="round" d="M174.3 311.9 A 113 113 0 0 1 110.1 279.9"/>
  <path class="d-stroke-0" stroke-width="5" stroke-linecap="round" d="M102.2 271.1 A 113 113 0 0 1 77.4 209.8"/>
  <path class="d-stroke-2" stroke-width="5" stroke-linecap="round" d="M77.0 198.0 A 113 113 0 0 1 97.4 135.2"/>
  <path class="d-stroke-1" stroke-width="5" stroke-linecap="round" d="M104.7 125.9 A 113 113 0 0 1 149.5 94.5"/>
  <path stroke-width="2" d="M318.9 252.1 A 139 139 0 0 1 286.6 300.0" marker-end="url(#sd-consistent-hashing-arrow)"/>
  <circle class="d-fill-0" stroke="none" cx="211.7" cy="76.9" r="8"/>
  <circle class="d-fill-1" stroke="none" cx="285.8" cy="119.7" r="8"/>
  <circle class="d-fill-2" stroke="none" cx="314.5" cy="210.9" r="8"/>
  <circle class="d-fill-0" stroke="none" cx="270.3" cy="295.8" r="8"/>
  <circle class="d-fill-2" stroke="none" cx="179.1" cy="324.5" r="8"/>
  <circle class="d-fill-1" stroke="none" cx="97.1" cy="283.6" r="8"/>
  <circle class="d-fill-0" stroke="none" cx="65.1" cy="204.4" r="8"/>
  <circle class="d-fill-2" stroke="none" cx="91.5" cy="123.0" r="8"/>
  <circle class="d-fill-1" stroke="none" cx="151.4" cy="81.1" r="8"/>
  <rect class="d-bg" x="299.9" y="240.8" width="12" height="12" stroke-width="2"/>
  <g fill="currentColor" stroke="none" font-size="12">
    <text x="216.9" y="51.4" text-anchor="start" class="d-fill-0" font-weight="600">A#0</text>
    <text x="308.7" y="104.4" text-anchor="start" class="d-fill-1" font-weight="600">B#0</text>
    <text x="344.4" y="217.5" text-anchor="start" class="d-fill-2" font-weight="600">C#0</text>
    <text x="289.6" y="322.7" text-anchor="start" class="d-fill-0" font-weight="600">A#1</text>
    <text x="176.5" y="358.4" text-anchor="middle" class="d-fill-2" font-weight="600">C#1</text>
    <text x="74.8" y="307.7" text-anchor="end" class="d-fill-1" font-weight="600">B#1</text>
    <text x="35.1" y="209.4" text-anchor="end" class="d-fill-0" font-weight="600">A#2</text>
    <text x="67.9" y="108.6" text-anchor="end" class="d-fill-2" font-weight="600">C#2</text>
    <text x="142.1" y="56.6" text-anchor="end" class="d-fill-1" font-weight="600">B#2</text>
    <text x="276.1" y="239.6" text-anchor="end">hash("user:42")</text>
    <text x="190" y="196" text-anchor="middle" font-size="13" font-weight="600">hash ring</text>
    <text x="190" y="214" text-anchor="middle" font-size="11" class="d-muted">0 … 2³² − 1, wraps</text>
    <text x="380" y="70" font-size="13" font-weight="600">Place</text>
    <text x="380" y="88" font-size="12">each server at many points:</text>
    <text x="380" y="106" font-size="12">hash(&quot;A#0&quot;), hash(&quot;A#1&quot;) …</text>
    <text x="380" y="124" font-size="11" class="d-muted">(virtual nodes)</text>
    <text x="380" y="154" font-size="13" font-weight="600">Look up</text>
    <text x="380" y="172" font-size="12">hash the key, walk clockwise</text>
    <text x="380" y="190" font-size="12">to the first virtual node:</text>
    <text x="380" y="208" font-size="12">user:42 → A</text>
    <text x="380" y="238" font-size="13" font-weight="600">Add or remove a server</text>
    <text x="380" y="256" font-size="12">only the arcs next to its points</text>
    <text x="380" y="274" font-size="12">change owner: about 1/N of keys</text>
    <text x="380" y="292" font-size="12">move, not almost all of them</text>
    <text x="380" y="310" font-size="11" class="d-muted">(hash mod N would move ~all)</text>
    <g font-size="11">
      <text x="380" y="350" class="d-fill-0" font-weight="600">server A</text>
      <text x="452" y="350" class="d-fill-1" font-weight="600">server B</text>
      <text x="524" y="350" class="d-fill-2" font-weight="600">server C</text>
    </g>
    <text x="300" y="388" text-anchor="middle" font-size="11" class="d-muted">colored arcs: the key range each virtual node owns (from the previous point up to it)</text>
  </g>
</svg>
