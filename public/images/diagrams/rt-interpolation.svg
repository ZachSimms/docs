<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 270" fill="none" stroke="currentColor">
  <defs>
    <marker id="rt-interpolation-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>
  <path stroke-width="1.5" d="M40 130 H 580" marker-end="url(#rt-interpolation-arrow)"/>
  <rect class="d-fill-0 d-tint" stroke="none" x="260" y="96" width="200" height="34"/>
  <g class="d-chip" stroke-width="1.5">
    <rect x="48" y="100" width="24" height="24" rx="4"/>
    <rect x="148" y="100" width="24" height="24" rx="4"/>
  </g>
  <rect class="d-fill-0 d-tint d-stroke-0" x="248" y="100" width="24" height="24" rx="4" stroke-width="1.5"/>
  <rect class="d-fill-0 d-tint d-stroke-0" x="448" y="100" width="24" height="24" rx="4" stroke-width="1.5"/>
  <rect class="d-bg d-muted" x="348" y="100" width="24" height="24" rx="4" stroke-width="1.2" stroke-dasharray="3 3"/>
  <path class="d-muted" stroke-width="1.5" d="M352 104 L 368 120 M368 104 L 352 120"/>
  <path class="d-stroke-2" stroke-width="2" d="M480 62 V 150"/>
  <path class="d-stroke-0" stroke-width="2" d="M280 62 V 150"/>
  <circle class="d-fill-0 d-stroke-0" cx="280" cy="130" r="6"/>
  <path stroke-width="1.5" d="M284 176 H 476" marker-start="url(#rt-interpolation-arrow)" marker-end="url(#rt-interpolation-arrow)"/>
  <g fill="currentColor" stroke="none">
    <text x="300" y="22" font-size="13" text-anchor="middle" font-weight="600">Entity interpolation: draw remote players in the past</text>
    <text x="300" y="40" font-size="11" text-anchor="middle" class="d-muted">snapshots every 50 ms (20 Hz), stamped with server time</text>
    <text x="280" y="56" font-size="12" text-anchor="middle" class="d-fill-0" font-weight="600">render time</text>
    <text x="480" y="56" font-size="12" text-anchor="middle" class="d-fill-2" font-weight="600">now</text>
    <g font-size="11" text-anchor="middle">
      <text x="60" y="148">0</text>
      <text x="160" y="148">50</text>
      <text x="260" y="162">100</text>
      <text x="360" y="148" class="d-muted">150 lost</text>
      <text x="460" y="162">200 ms</text>
    </g>
    <text x="380" y="194" font-size="12" text-anchor="middle">delay = 100 ms (2 × send interval)</text>
    <text x="300" y="220" font-size="11" text-anchor="middle">Lerp between the two buffered snapshots around render time: 100 and 200,</text>
    <text x="300" y="236" font-size="11" text-anchor="middle">so one lost packet (150) is bridged. Own player: predicted, not interpolated.</text>
    <text x="300" y="256" font-size="11" text-anchor="middle" class="d-muted">Buffer empty (a longer gap): hold the last position or extrapolate briefly.</text>
  </g>
</svg>
