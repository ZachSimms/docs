  </g>
  <g class="d-stroke-1" stroke-width="2">
    <path d="M91 214 C 130 214 130 244 168 244" marker-end="url(#dsa-array-vs-list-arrow)"/>
    <path d="M231 244 C 270 244 270 204 308 204" marker-end="url(#dsa-array-vs-list-arrow)"/>
