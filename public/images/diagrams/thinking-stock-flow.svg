<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" fill="none" stroke="currentColor">
  <defs>
    <marker id="thinking-stock-flow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="currentColor" stroke="none"/>
    </marker>
    <marker id="thinking-stock-flow-info" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="d-fill-1" d="M0 0 L10 5 L0 10 z" stroke="none"/>
    </marker>
  </defs>
  <g class="d-muted" stroke-width="1.5">
    <path d="M22 118 a12 12 0 0 1 4 -22 a14 14 0 0 1 26 -6 a12 12 0 0 1 16 14 a10 10 0 0 1 -6 14 z"/>
    <path d="M532 118 a12 12 0 0 1 4 -22 a14 14 0 0 1 26 -6 a12 12 0 0 1 16 14 a10 10 0 0 1 -6 14 z"/>
  </g>
  <g stroke-width="1.5">
    <path d="M68 100 H 138"/>
    <path d="M68 112 H 138"/>
    <path d="M162 100 H 222"/>
    <path d="M162 112 H 222"/>
    <path d="M370 100 H 438"/>
    <path d="M370 112 H 438"/>
    <path d="M462 100 H 524"/>
    <path d="M462 112 H 524"/>
  </g>
  <path d="M222 94 L 230 106 L 222 118 Z" fill="currentColor" stroke="none"/>
  <path d="M524 94 L 532 106 L 524 118 Z" fill="currentColor" stroke="none"/>
  <path class="d-fill-2 d-tint d-stroke-2" stroke-width="1.5" d="M138 92 L 162 120 L 162 92 L 138 120 Z"/>
  <path class="d-fill-1 d-tint d-stroke-1" stroke-width="1.5" d="M438 92 L 462 120 L 462 92 L 438 120 Z"/>
  <path d="M150 106 V 76" stroke-width="1.5"/>
  <path d="M450 106 V 76" stroke-width="1.5"/>
  <circle class="d-fill-2 d-tint d-stroke-2" cx="150" cy="68" r="8" stroke-width="1.5"/>
  <circle class="d-fill-1 d-tint d-stroke-1" cx="450" cy="68" r="8" stroke-width="1.5"/>
  <rect class="d-fill-0 d-tint d-stroke-0" x="230" y="66" width="140" height="80" rx="3" stroke-width="2"/>
  <path class="d-stroke-1" stroke-width="1.5" stroke-dasharray="5 4" d="M340 66 C 355 30, 405 34, 440 62" marker-end="url(#thinking-stock-flow-info)"/>
  <g fill="currentColor" stroke="none">
    <text x="300" y="100" font-size="14" font-weight="700" text-anchor="middle" class="d-fill-0">Users</text>
    <text x="300" y="118" font-size="11" text-anchor="middle" class="d-muted">stock (a level)</text>
    <text x="150" y="142" font-size="12" text-anchor="middle">inflow: sign-ups / month</text>
    <text x="450" y="142" font-size="12" text-anchor="middle">outflow: churn / month</text>
    <text x="390" y="30" font-size="11" text-anchor="middle" class="d-fill-1">churn = c × Users</text>
    <g class="d-muted" font-size="11" text-anchor="middle">
      <text x="45" y="76">source</text>
      <text x="555" y="76">sink</text>
      <text x="150" y="158">(valve: a rate)</text>
      <text x="450" y="158">(valve: a rate)</text>
    </g>
    <text x="300" y="196" font-size="12" text-anchor="middle">Users(t+1) = Users(t) + sign-ups − churn</text>
    <text x="300" y="216" font-size="12" text-anchor="middle">steady state when inflow = outflow: Users* = sign-ups ÷ c</text>
    <text x="300" y="238" font-size="11" text-anchor="middle" class="d-muted">e.g. 1,000 sign-ups a month and 5% monthly churn level off at 20,000 users</text>
  </g>
</svg>
